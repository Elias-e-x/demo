<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cedar Roasters – Sales</title>
<style>
  :root {
    --bg: #F2F4F1;
    --surface: #FFFFFF;
    --ink: #18231E;
    --muted: #66746C;
    --line: #D9DFDA;
    --green: #2F6A4E;
    --roast: #7A4A2E;
    --amber: #D9952B;
    --down: #B4472F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 40px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }
  .brand { color: var(--roast); font-weight: 600; margin: 0 0 2px; }
  h1 { font-size: 34px; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
  h2 { font-size: 17px; margin: 0 0 14px; font-weight: 650; }

  .range { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .range button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer;
  }
  .range button[aria-pressed="true"] { background: var(--green); color: #fff; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 20px;
  }
  .kpi { padding: 18px 22px; }
  .kpi + .kpi { border-left: 1px solid var(--line); }
  .kpi .label { color: var(--muted); font-size: 14px; }
  .kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .delta { font-size: 13px; font-weight: 600; }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--down); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
  .readout { color: var(--muted); font-variant-numeric: tabular-nums; }
  .readout strong { color: var(--ink); font-size: 20px; margin-left: 6px; }
  #chart { width: 100%; height: 300px; display: block; }
  #chart .grid { stroke: var(--line); stroke-width: 1; }
  #chart .axis { fill: var(--muted); font-size: 12px; }
  #chart .area { fill: var(--green); opacity: 0.12; }
  #chart .line { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linejoin: round; }
  #chart .cross { stroke: var(--roast); stroke-width: 1; stroke-dasharray: 3 3; }
  #chart .dot { fill: var(--surface); stroke: var(--roast); stroke-width: 2.5; }

  .lower { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; margin-top: 20px; }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .bar-top span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar { height: 10px; border-radius: 5px; background: #EEE7E1; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--roast); border-radius: 5px; transition: width 0.4s ease; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 0 8px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; padding-right: 0; }
  .status { font-weight: 600; font-size: 13px; }
  .status.shipped { color: var(--green); }
  .status.roasting { color: var(--amber); }
  .status.refunded { color: var(--down); }

  @media (max-width: 860px) {
    body { padding: 20px 16px 32px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi:nth-child(3) { border-left: 0; }
    .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
    .lower { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<header>
  <div>
    <p class="brand">Cedar Roasters</p>
    <h1>Online sales</h1>
  </div>
  <div class="range" role="group" aria-label="Date range">
    <button type="button" data-days="7" aria-pressed="false">7 days</button>
    <button type="button" data-days="30" aria-pressed="true">30 days</button>
    <button type="button" data-days="90" aria-pressed="false">90 days</button>
  </div>
</header>

<section class="kpis" aria-label="Key numbers">
  <div class="kpi"><div class="label">Revenue</div><div class="value" id="k-rev">–</div><div class="delta" id="d-rev"></div></div>
  <div class="kpi"><div class="label">Orders</div><div class="value" id="k-ord">–</div><div class="delta" id="d-ord"></div></div>
  <div class="kpi"><div class="label">Average order</div><div class="value" id="k-aov">–</div><div class="delta" id="d-aov"></div></div>
  <div class="kpi"><div class="label">Returning customers</div><div class="value" id="k-ret">–</div><div class="delta" id="d-ret"></div></div>
</section>

<section class="panel">
  <div class="chart-head">
    <h2>Daily revenue</h2>
    <div class="readout" id="readout" aria-live="polite"></div>
  </div>
  <svg id="chart" role="img" aria-label="Line chart of daily revenue"></svg>
</section>

<div class="lower">
  <section class="panel">
    <h2>Best-selling coffees</h2>
    <div id="products"></div>
  </section>
  <section class="panel">
    <h2>Latest orders</h2>
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th class="num">Total</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
  </section>
</div>

<script>
  // ---- Demo data (generated, deterministic) ----
  const END = new Date(2026, 9, 23);
  const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const num = new Intl.NumberFormat("en-US");

  function rng(seed) {
    return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  }

  function makeSeries(days, offsetDays, seed) {
    const r = rng(seed);
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(END);
      d.setDate(END.getDate() - i - offsetDays);
      const weekend = d.getDay() === 5 || d.getDay() === 6;
      const trend = 1 + (days - i) / days * 0.12;
      const revenue = Math.round((1650 + r() * 700) * (weekend ? 1.35 : 1) * trend);
      const orders = Math.round(revenue / (22 + r() * 4));
      out.push({ date: d, revenue, orders });
    }
    return out;
  }

  const sum = (arr, k) => arr.reduce((a, d) => a + d[k], 0);
  const pct = (now, before) => ((now - before) / before) * 100;

  function setDelta(id, change) {
    const el = document.getElementById(id);
    const up = change >= 0;
    el.className = "delta " + (up ? "up" : "down");
    el.textContent = (up ? "▲ " : "▼ ") + Math.abs(change).toFixed(1) + "% vs previous period";
  }

  function shortMoney(v) { return v >= 1000 ? "$" + (v / 1000).toFixed(1) + "k" : "$" + Math.round(v); }
  function dayLabel(d, days) {
    return days <= 7
      ? d.toLocaleDateString("en-US", { weekday: "short" })
      : d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  // ---- Rendering ----
  let current = [];

  function drawChart(series, days) {
    const svg = document.getElementById("chart");
    const W = svg.clientWidth || 800, H = 300;
    const pad = { t: 16, r: 14, b: 30, l: 52 };
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const max = Math.max(...series.map(d => d.revenue)) * 1.1;
    const span = (W - pad.l - pad.r) / (series.length - 1);
    const x = i => pad.l + i * span;
    const y = v => pad.t + (1 - v / max) * (H - pad.t - pad.b);

    let g = "";
    for (let k = 0; k <= 4; k++) {
      const v = (max * k) / 4, yy = y(v);
      g += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}"/>`;
      g += `<text class="axis" x="${pad.l - 8}" y="${yy + 4}" text-anchor="end">${shortMoney(v)}</text>`;
    }
    const step = Math.ceil(series.length / 7);
    series.forEach((d, i) => {
      const last = i === series.length - 1;
      if (last || (i % step === 0 && series.length - 1 - i >= step / 2)) {
        g += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${dayLabel(d.date, days)}</text>`;
      }
    });
    const line = series.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d.revenue).toFixed(1)}`).join("");
    const area = `${line}L${x(series.length - 1)},${y(0)}L${x(0)},${y(0)}Z`;
    svg.innerHTML = g +
      `<path class="area" d="${area}"/><path class="line" d="${line}"/>` +
      `<line id="cross" class="cross" y1="${pad.t}" y2="${y(0)}"/><circle id="dot" class="dot" r="5"/>`;

    function show(i) {
      const d = series[i];
      document.getElementById("cross").setAttribute("x1", x(i));
      document.getElementById("cross").setAttribute("x2", x(i));
      document.getElementById("dot").setAttribute("cx", x(i));
      document.getElementById("dot").setAttribute("cy", y(d.revenue));
      const label = d.date.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      document.getElementById("readout").innerHTML =
        `${label}, ${num.format(d.orders)} orders <strong>${money.format(d.revenue)}</strong>`;
    }
    svg.onmousemove = e => {
      const rect = svg.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (W / rect.width);
      show(Math.max(0, Math.min(series.length - 1, Math.round((px - pad.l) / span))));
    };
    svg.onmouseleave = () => show(series.length - 1);
    show(series.length - 1);
  }

  function renderProducts(days) {
    const r = rng(days * 31);
    const items = [
      ["Qadisha single origin", 0.31],
      ["House espresso", 0.27],
      ["Bekaa breakfast blend", 0.19],
      ["Cold brew packs", 0.13],
      ["Decaf Colombia", 0.10],
    ].map(([name, share]) => [name, share * (0.85 + r() * 0.3)]);
    items.sort((a, b) => b[1] - a[1]);
    const top = items[0][1];
    const total = sum(current, "revenue");
    document.getElementById("products").innerHTML = items.map(([name, share]) => `
      <div class="bar-row">
        <div class="bar-top"><span>${name}</span><span>${money.format(total * share * 0.8)}</span></div>
        <div class="bar"><i style="width:${(share / top) * 100}%"></i></div>
      </div>`).join("");
  }

  function renderOrders() {
    const rows = [
      ["#4821", "Rania K.", "roasting", 64],
      ["#4820", "Marc H.", "shipped", 38],
      ["#4819", "Nour A.", "shipped", 112],
      ["#4818", "Elie S.", "refunded", 27],
      ["#4817", "Sara M.", "shipped", 49],
      ["#4816", "Karim B.", "shipped", 73],
    ];
    document.getElementById("orders").innerHTML = rows.map(([id, who, st, tot]) => `
      <tr><td>${id}</td><td>${who}</td>
      <td><span class="status ${st}">${st[0].toUpperCase() + st.slice(1)}</span></td>
      <td class="num">${money.format(tot)}</td></tr>`).join("");
  }

  function render(days) {
    current = makeSeries(days, 0, 1000 + days);
    const previous = makeSeries(days, days, 2000 + days);
    const rev = sum(current, "revenue"), ord = sum(current, "orders");
    const prevRev = sum(previous, "revenue") * 0.94, prevOrd = sum(previous, "orders") * 0.95;
    const ret = 38 + (days % 7), prevRet = ret - 2.4;

    document.getElementById("k-rev").textContent = money.format(rev);
    document.getElementById("k-ord").textContent = num.format(ord);
    document.getElementById("k-aov").textContent = money.format(rev / ord);
    document.getElementById("k-ret").textContent = ret + "%";
    setDelta("d-rev", pct(rev, prevRev));
    setDelta("d-ord", pct(ord, prevOrd));
    setDelta("d-aov", pct(rev / ord, prevRev / prevOrd));
    setDelta("d-ret", pct(ret, prevRet));

    drawChart(current, days);
    renderProducts(days);
  }

  let days = 30;
  document.querySelectorAll(".range button").forEach(btn => {
    btn.addEventListener("click", () => {
      days = Number(btn.dataset.days);
      document.querySelectorAll(".range button").forEach(b => b.setAttribute("aria-pressed", b === btn));
      render(days);
    });
  });
  window.addEventListener("resize", () => drawChart(current, days));
  renderOrders();
  render(days);
</script>
</body>
</html>
