# ------------------------------------------------------------------
# TEMPLATE ONLY. Do not put real values in this file.
#
# Locally: copy this file to .streamlit/secrets.toml (which is
#          git-ignored) and fill in your real values.
# Online:  paste the filled-in contents into Streamlit Cloud under
#          App settings → Secrets.
# ------------------------------------------------------------------

[auth]
# Where Auth0 sends users back after login.
#   Local testing:   http://localhost:8501/oauth2callback
#   Streamlit Cloud: https://YOUR-APP-NAME.streamlit.app/oauth2callback
redirect_uri = "http://localhost:8501/oauth2callback"

# Any long random string. Used to sign the login cookie.
# Generate one with:  python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_STRING"

# From Auth0 → Applications → your app → Settings
client_id = "REPLACE_WITH_AUTH0_CLIENT_ID"
client_secret = "REPLACE_WITH_AUTH0_CLIENT_SECRET"

# Replace YOUR-TENANT.REGION.auth0.com with the "Domain" shown in Auth0
server_metadata_url = "https://YOUR-TENANT.REGION.auth0.com/.well-known/openid-configuration"
